{% extends "base.html" %}
{% block title %}Login · Insurance Buddy{% endblock %}
{% block content %}
<section class="max-w-xl mx-auto px-6 py-12">
    <div class="bg-white shadow-floating rounded-2xl p-8 border border-slate-100">
        <h1 class="text-2xl font-semibold text-brand mb-2">Login</h1>
        <p class="text-sm text-slate-600 mb-6">Sign in to manage your profile, deals, and offers.</p>
        {% if error %}
            <div class="mb-4 rounded-lg border border-rose-200 bg-rose-50 text-rose-700 px-4 py-3 text-sm">
                {{ error }}
            </div>
        {% endif %}
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
                <input type="text" name="username" class="w-full rounded-lg border border-slate-200 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-accent" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                <input type="password" name="password" class="w-full rounded-lg border border-slate-200 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-accent" required>
            </div>
            <button type="submit" class="w-full gradient-button text-sm font-semibold">Login</button>
        </form>
        <p class="text-sm text-slate-600 mt-4">No account? <a href="{% url 'signup' %}" class="text-brand font-semibold underline">Sign up</a></p>
    </div>
</section>
{% endblock %}
